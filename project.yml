name: LumenAI
options:
  bundleIdPrefix: com.lumenai
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LumenAI:
    type: application
    platform: iOS
    sources:
      - LumenAI
      - path: appicon.icon
        buildPhase: resources
    dependencies:
      - framework: llama.xcframework
        embed: false
      - framework: ssh.xcframework
        embed: false
      - framework: SherpaOnnxC.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LumenAI
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenai.app
        # iOS 26 App 图标：Icon Composer 工程（appicon.icon）作为官方 AppIcon 源，
        # 由 actool 用 Icon Composer 渲染管线生成含液态玻璃效果的全部变体
        ASSETCATALOG_COMPILER_APPICON_NAME: appicon
        MARKETING_VERSION: 0.3.49
        CURRENT_PROJECT_VERSION: 50
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # 语音输入（ASR）：SFSpeechRecognizer + 麦克风
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 用于将您的语音转换为文字（语音输入）。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于采集您的声音以进行语音识别。
        # 云端生图：把生成的图片保存到相册（仅添加）
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 用于把 AI 生成的图片保存到您的相册。
        # llama.cpp 为 C++ 源码，宿主 App 必须开启 Swift/C++ 互操作
        SWIFT_OBJC_INTEROP_MODE: objcxx
        # 暴露 C 桥接头文件给 Swift
        SWIFT_OBJC_BRIDGING_HEADER: LumenAI/LumenAI-Bridging-Header.h
        # llama.cpp / mtmd 头文件（来自 llama.xcframework 的 Headers）
        HEADER_SEARCH_PATHS: $(SRCROOT)/llama.xcframework/ios-arm64/Headers $(SRCROOT)/ssh.xcframework/ios-arm64/Headers $(SRCROOT)/SherpaOnnxC.xcframework/ios-arm64/SherpaOnnxC.framework/Headers $(SRCROOT)/LumenAI/LlamaCore
        # C++20 + 多模态开关
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        OTHER_CPLUSPLUSFLAGS: -DBRIDGE_ENABLE_MTMD -std=c++20
        # 关闭 bitcode（iOS 已废弃）
        ENABLE_BITCODE: NO
        # 链接后端框架
        OTHER_LDFLAGS: $(inherited) -framework Metal -framework Accelerate -framework Foundation

schemes:
  LumenAI:
    build:
      targets:
        LumenAI: all
    run:
      config: Debug
    archive:
      config: Release
