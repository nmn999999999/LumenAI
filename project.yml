name: LumenAI
options:
  bundleIdPrefix: com.lumenai
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# ── 构建配置 ─────────────────────────────────────
# 单一变体：合成触摸（tap/tap 变体 / SIMULATE_TAP）已整体移除。
# 手机操作改为「快捷指令主导 + 实时指导用户操作」的协作模式，不再含私有 API。
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LumenAI:
    type: application
    platform: iOS
    sources:
      - path: LumenAI
        # 这两个是**内核侧**源码，不能由 Xcode 编：
        #   · lumen_kernel_addon.c 要 __KERNEL__ + 内核头（-include linux/kconfig.h 等）；
        #   · lumen_percpu_align.S 是给链接器补页对齐的，和内核成员必须落在一起。
        # 它们由 scripts/build-ish-libs.sh 用内核那套 flag 编好、合成进 liblumen-linux.a。
        # 让 Xcode 也编一遍的话，前者会直接编译失败，后者会变成"内核里那份 + App 里那份"
        # 两份对齐块（不致命但没意义）。
        excludes:
          - "Services/Linux/lumen_kernel_addon.c"
          - "Services/Linux/lumen_percpu_align.S"
      - path: appicon.icon
        buildPhase: resources
    dependencies:
      - framework: llama.xcframework
        embed: false
      - framework: ssh.xcframework
        embed: false
      # SherpaOnnxC 是动态框架（主二进制 @rpath 引用），必须 embed 进 app/Frameworks
      - framework: SherpaOnnxC.xcframework
        embed: true
      # Widget 扩展必须 embed 进 App 的 PlugIns/，否则 ipa 里根本没有它 ——
      # 而表现是"代码都写了、装上去灵动岛就是不出来"，最难查的那类问题。
      - target: LumenAIWidget
        embed: true
      # CosyVoice3 引擎（MLX）—— 只引入这一个 product，不拉其它模型库
      - package: SpeechSwift
        product: CosyVoiceTTS
    # URL scheme 必须走 info.properties：`INFOPLIST_KEY_*` 只能表达字符串，
    # 而 CFBundleURLTypes 是一个**数组套字典**的结构，用那种写法会静默丢掉。
    # 不注册它的后果：灵动岛/锁屏卡片上的 widgetURL("lumenai://chat") 点了没反应，
    # 而且不报任何错 —— 表现是"点了没动静"。
    info:
      path: LumenAI/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.lumenai.app
            CFBundleURLSchemes: [lumenai]
        # 没有这两行，`canOpenURL(shortcuts://…)` 恒为 false。声明只影响查询。
        LSApplicationQueriesSchemes: [itms-apps, prefs]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LumenAI
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenai.app
        # iOS 26 App 图标：Icon Composer 工程（appicon.icon）作为官方 AppIcon 源，
        # 由 actool 用 Icon Composer 渲染管线生成含液态玻璃效果的全部变体
        ASSETCATALOG_COMPILER_APPICON_NAME: appicon
        MARKETING_VERSION: 0.3.87
        CURRENT_PROJECT_VERSION: 87
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # 实时活动（灵动岛 / 锁屏）的开关。**缺了它 Activity.request 会直接抛异常**，
        # 而错误信息只说请求失败，不会告诉你"是 Info.plist 少了个 key"。
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # 允许较高频更新：agent 循环里阶段切换（思考→执行工具→完成）可能几秒一次，
        # 不开这个的话系统会把更新合并/延后，观感变成"卡住不动"。
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # iPad 必须**四个方向全支持**，否则打包校验会报
        # 「All interface orientations must be supported unless the app requires full screen」。
        # 上面那条是 iPhone 的键（不含倒置），之前只写了它 —— 而
        # TARGETED_DEVICE_FAMILY 是 "1,2"（iPhone + iPad），于是这条告警一直在。
        # 多窗口/分屏下 iPad 本来就要能四向旋转，所以补全而不是声明"仅全屏"。
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # 语音输入（ASR）：SFSpeechRecognizer + 麦克风
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 用于将您的语音转换为文字（语音输入）。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于采集您的声音以进行语音识别。
        # 云端生图：把生成的图片保存到相册（仅添加）
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 用于把 AI 生成的图片保存到您的相册。
        # llama.cpp 为 C++ 源码，宿主 App 必须开启 Swift/C++ 互操作
        SWIFT_OBJC_INTEROP_MODE: objcxx
        # 暴露 C 桥接头文件给 Swift
        SWIFT_OBJC_BRIDGING_HEADER: LumenAI/LumenAI-Bridging-Header.h
        # llama.cpp / mtmd 头文件（来自 llama.xcframework 的 Headers）
        HEADER_SEARCH_PATHS: $(SRCROOT)/llama.xcframework/ios-arm64/Headers $(SRCROOT)/ssh.xcframework/ios-arm64/Headers $(SRCROOT)/SherpaOnnxC.xcframework/ios-arm64/SherpaOnnxC.framework/Headers $(SRCROOT)/LumenAI/LlamaCore $(SRCROOT)/third_party/ish/app $(SRCROOT)/third_party/ish/deps/libarchive/libarchive
        # C++20 + 多模态开关
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        OTHER_CPLUSPLUSFLAGS: -DBRIDGE_ENABLE_MTMD -std=c++20
        # 关闭 bitcode（iOS 已废弃）
        ENABLE_BITCODE: NO
        # 链接后端框架
        # iSH「Linux 模式」= 真 Linux 内核（liblinux）+ iSH 的 Linux 接口层（libiSHLinux）
        # + 模拟器（libish_emu）+ fakefs + 我们那两个内核侧补丁 —— **合成一个** liblumen-linux.a。
        #
        # 为什么必须合成（而不是在这里分别列 .a）：initcall 的执行顺序 = 目标文件在链接命令行上的
        # 先后。内核侧的 init_devpts_fs（level 6）必须先于 app 侧的 ios_pty_init（也是 level 6）跑，
        # 否则 do_mount("devpts") 返回 -ENODEV，而 LinuxPTY.c 那行是 panic()。
        # Xcode 的链接行是「app 的所有 .o → 再 …OTHER_LDFLAGS」，-force_load 只会落在 app 对象之后，
        # 所以分别列的话顺序必然是反的；合成库里成员顺序由脚本固定成「内核 → app 层」。
        # ⚠️ 这个库由 scripts/build-ish-libs.sh 的 ISH_BUILD_LINUX=1 生成（CI 里也是这一步）。
        # -lsqlite3：fakefs 的元数据库（meta.db）。-liconv：libarchive 解 tar 时要转字符集
        # （少了它报的是 libarchive.a 里 _iconv_open 未定义，看着像 libarchive 的问题，其实是链接缺库）。
        # -lresolv：把宿主 DNS 注入客户机 /etc/resolv.conf 要用 res_ninit / res_getservers
        # （符号在 iOS 上是 res_9_* 别名，所以必须真链上 libresolv —— 少了它 ld 报的是
        # "_res_9_ninit undefined"，看着像代码写错，其实是链接缺库）。上游 iSH 也链它。
        OTHER_LDFLAGS: $(inherited) -framework Metal -framework Accelerate -framework Foundation -framework WebKit -Wl,-u,_lumen_linux_kernel_entry -Wl,-u,_lumen_linux_emu_marker -Wl,-force_load,$(SRCROOT)/third_party/ish/build/ReleaseLinux-iphoneos/liblumen-linux.a $(SRCROOT)/third_party/ish/build/ReleaseLinux-iphoneos/meson/libish_emu.a $(SRCROOT)/third_party/ish/build/ReleaseLinux-iphoneos/meson/libfakefs.a $(SRCROOT)/third_party/ish/deps/build/Release-iphoneos/libarchive.a -lsqlite3 -liconv -lresolv

  # 灵动岛 / 锁屏实时活动扩展。
  LumenAIWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LumenAIWidget
      # ⚠️ 共享的数据契约要**同时**编进扩展：ActivityAttributes 必须两个 target
      # 各有一份（它没有独立的框架可共享）。漏了它，扩展那边会报"找不到类型"，
      # 而报错位置指向灵动岛的布局代码，看起来像 UI 写错了。
      - path: LumenAI/LiveActivity/LumenAIActivityAttributes.swift
      # 意图类型也要同时编进扩展：灵动岛上的按钮**由扩展渲染**，
      # 它必须能构造出这两个 AppIntent 才能把按钮画出来（执行仍在 App 进程）。
      # 漏了它，扩展那边会报"找不到类型"，而报错位置指向按钮代码，看着像 UI 写错。
      - path: LumenAI/LiveActivity/ApprovalIntents.swift
    info:
      path: LumenAIWidget/Info.plist
      properties:
        CFBundleDisplayName: LumenAI
        # ⚠️ 扩展的版本必须与主 App **完全一致**：不一致是 App Store 上传会被直接拒的
        # 那类问题（"The bundle version of the extension does not match the app"）。
        # 不写这两个键时 XcodeGen 用默认值 1.0 —— 而它不会报错，只是静静地对不上。
        # 用 $(MARKETING_VERSION) 引用构建设置，这样以后升版本只改一处。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          # 这个 identifier 决定扩展的类型，写错的话系统根本不认它（不会报错，只是不出现）
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumenai.app.widget
        MARKETING_VERSION: 0.3.87
        CURRENT_PROJECT_VERSION: 87
        TARGETED_DEVICE_FAMILY: "1,2"
        # 扩展不单独安装进 /Applications
        SKIP_INSTALL: YES

schemes:
  LumenAI:
    build:
      targets:
        LumenAI: all
      # SPM 的 checkout 是只读的，而且重新解析依赖会把它重置回上游原样。
      # 上游 v0.0.28 的 CosyVoice 加载器不认 4-bit 权重（详见脚本注释），
      # 所以每次构建前都把补丁重新打一遍 —— 脚本幂等，已打过就跳过。
      preActions:
        - name: 修补 speech-swift（放行 4-bit CosyVoice3 权重）
          script: |
            /usr/bin/env python3 "$SRCROOT/scripts/patch-speech-swift.py" || true
          settingsTarget: LumenAI
        # 本地 Linux 模式：按需构建 iSH 引擎静态库（打 vdso 补丁用 zig；已存在则跳过）。
        # 需要 meson/ninja/zig；缺失时脚本会失败，链接阶段即报错，提示明确。
        - name: 构建 iSH 引擎静态库（Linux 模式）
          script: |
            /bin/bash "$SRCROOT/scripts/build-ish-libs.sh"
          settingsTarget: LumenAI
    run:
      config: Debug
    archive:
      config: Release

# ── SPM 依赖 ─────────────────────────────────────────────
# speech-swift：Apple Silicon 上的本地语音引擎集合（MLX Swift + Core ML）。
# 我们要的是 CosyVoiceTTS —— 它是**另一套引擎**，与现有的 sherpa-onnx 无关：
# sherpa 走 CPU/ONNX，它走 MLX（Metal GPU），模型也是新一代端到端架构。
packages:
  SpeechSwift:
    url: https://github.com/soniqo/speech-swift.git
    exactVersion: 0.0.28
