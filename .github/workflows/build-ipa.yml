# ============================================================
# LocalAI — 云端 IPA 构建工作流（由 Windows 触发）
#
# 用法：
#   1. 将本仓库推送到 GitHub（公开仓库免费额度无限）
#   2. Actions 页 → Build IPA → Run workflow
#   3. 完成后在 Artifacts 下载 localai-unsigned.ipa
#   4. Windows 上用 Sideloadly / AltServer 对该 IPA 签名并安装
#
# 可选自动签名：配置仓库 Secrets
#   P12_BASE64              证书 p12 的 base64（base64 -w0 cert.p12）
#   P12_PASSWORD            证书密码
#   MOBILEPROVISION_BASE64  描述文件 base64
#   SIGN_IDENTITY           如 "Apple Distribution: Your Name (TEAMID)"
# 配置后工作流会额外产出 localai-signed.ipa，可直接安装。
# ============================================================

name: Build IPA

# 触发方式：**仅手动**。
#
# 原来还有 push 触发，但它必然失败 —— 三个 xcframework（llama / ssh / SherpaOnnxC）
# 都不在 git 里（.gitignore 掉了，由本地脚本重建），CI checkout 后一个框架都没有；
# 加上 workflow 里的工程名还是过期的 `LocalAI.xcodeproj`（实际是 LumenAI）。
# 实测：9-6、9-12 与本日的推送全部 30 秒内失败。本项目走**本地构建**。
# 若要恢复 push 触发，把下面两行加回来即可：
#   push:
#     branches: [main]
on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 选择镜像上最新的 Xcode（需 ≥ 26 以支持 Liquid Glass API）
      - name: Select latest Xcode
        run: |
          ls /Applications | grep Xcode || true
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          swift --version

      # 由 project.yml 生成 .xcodeproj（内含 LLM.swift SPM 依赖声明）
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LocalAI.xcodeproj

      # 无证书编译真机包（未签名 .app）
      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalAI.xcodeproj \
            -scheme LocalAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -skipMacroValidation

      # 检测是否配置了签名 Secrets
      - name: Check signing availability
        id: signcheck
        env:
          HAS_P12: ${{ secrets.P12_BASE64 != '' }}
          HAS_PASS: ${{ secrets.P12_PASSWORD != '' }}
          HAS_PROF: ${{ secrets.MOBILEPROVISION_BASE64 != '' }}
          HAS_IDENT: ${{ secrets.SIGN_IDENTITY != '' }}
        run: |
          if [ "$HAS_P12" = "true" ] && [ "$HAS_PASS" = "true" ] \
             && [ "$HAS_PROF" = "true" ] && [ "$HAS_IDENT" = "true" ]; then
            echo "signed=true"  >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 可选：自动签名 ----------
      - name: Import certificate
        if: steps.signcheck.outputs.signed == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.P12_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Sign app
        if: steps.signcheck.outputs.signed == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          PROFILE_B64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          APP="build/Build/Products/Release-iphoneos/LocalAI.app"
          echo "$PROFILE_B64" | base64 --decode > /tmp/app.mobileprovision
          cp /tmp/app.mobileprovision "$APP/embedded.mobileprovision"
          codesign --force --options runtime \
            --sign "$SIGN_IDENTITY" \
            --timestamp \
            "$APP"
          codesign --verify --strict "$APP" && echo "✅ 签名校验通过"

      - name: Package signed IPA
        if: steps.signcheck.outputs.signed == 'true'
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LocalAI.app Payload/
          zip -qry localai-signed.ipa Payload
          rm -rf Payload

      # ---------- 未签名产物（供 Sideloadly / AltStore 签名）----------
      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LocalAI.app Payload/
          zip -qry localai-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localai-ipa
          path: |
            localai-unsigned.ipa
            localai-signed.ipa
          if-no-files-found: ignore
          retention-days: 14
