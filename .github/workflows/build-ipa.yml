# ============================================================
# LumenAI — 云端 IPA 构建工作流
#
# 用法：
#   1. 先把三个 xcframework 打包上传到一个 Release（见下方「框架包」）
#   2. Actions 页 → Build IPA → Run workflow
#   3. 完成后在 Artifacts 下载 LumenAI-unsigned.ipa
#   4. 用 Sideloadly / AltStore 对该 IPA 自签并安装
#
# 可选自动签名：配置仓库 Secrets（四个都给才会产出 signed 包）
#   P12_BASE64              证书 p12 的 base64（base64 -w0 cert.p12）
#   P12_PASSWORD            证书密码
#   MOBILEPROVISION_BASE64  描述文件 base64
#   SIGN_IDENTITY           如 "Apple Distribution: Your Name (TEAMID)"
#
# ── 框架包（本工作流成立的前提）────────────────────────────
# 仓库里**没有** llama / ssh / SherpaOnnxC 三个 xcframework（.gitignore 掉了，
# 它们是本地交叉编译产物，见 build_llama_xcframework.sh）。CI checkout 后一个都没有，
# 直接编译必然失败 —— 这就是之前 push 触发"30 秒必挂"的原因。
#
# 所以本工作流第一步会从 Release 拉一个框架包再解压到仓库根目录。
# 在本地有这三个框架的机器上（仓库根目录）执行：
#
#   tar -czf ios-frameworks.tar.gz llama.xcframework ssh.xcframework SherpaOnnxC.xcframework
#   gh release create ios-frameworks --title "iOS Frameworks" \
#     --notes "CI 构建依赖的 xcframework（llama/ssh/SherpaOnnxC）" ios-frameworks.tar.gz
#
# 之后（更新框架时换 tag 或 --clobber 重传）：
#   gh release upload ios-frameworks ios-frameworks.tar.gz --clobber
#
# tag / 资产名可在 Run workflow 时改，默认 ios-frameworks / ios-frameworks.tar.gz。
# ============================================================

name: Build IPA

# 触发方式：手动 + push（main / trae 分支）。
#
# 为什么恢复 push 触发：框架已由下面的拉取步骤提供，push 不再必然失败（历史上 8-30~9-30
# 那些 push 触发全挂，是因为当时 checkout 后没有任何 xcframework）。
# 另一个原因：手动 workflow_dispatch 要求 token 带 workflow scope，而该 scope 在本环境
# 无法保持（gh auth refresh 拿到后会被重置，实测 dispatch 又变 403）；
# push 事件由 Git 推送本身触发，不依赖任何 token scope，更可靠。
# 公开仓库 Actions 分钟数免费，代价只是每次 push 跑一遍构建。
on:
  workflow_dispatch:
    inputs:
      frameworks_tag:
        description: "框架包所在的 Release tag"
        required: false
        default: ios-frameworks
      frameworks_asset:
        description: "框架包资产名"
        required: false
        default: ios-frameworks.tar.gz
  push:
    # 只跑 main 与 trae/* 分支，避免任何临时分支的推送都触发整包构建。
    branches: [main, 'trae/**']

permissions:
  contents: read

# 连续 push 时只保留最新一次构建：macOS runner 排队 + 编译各要十几分钟，
# 旧提交那次已经没有产物价值，留着只是占队列。
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # third_party/ish 是 iSH（Linux 模式引擎）的源代码，主工程的链接阶段要用它编出来的
          # 5 个 .a。**没有这一步 CI 必挂**（实测：run 38117739105 —— 子模块是空的，
          # 只看到 "iSH 子模块缺失，跳过"，随后 xcodebuild 报
          # "third_party/ish/iSH.xcodeproj does not exist"，构建在 3 分钟内失败）。
          submodules: recursive

      # 选一个与**本地构建工具链一致**的 Xcode：本地是 Xcode 26.1
      # （IPA 的 Info.plist: DTXcode=2610 / DTXcodeBuild=17B55 / SDK iphoneos26.1=23B77），Swift 6.2.x。
      #
      # 为什么要固定、而不是用"最新"：runner 上最新是 26.6（Swift 6.3.3），其严格并发检查
      # 会把本地能编过的代码判为 error —— 实测 LiveActivityManager 里
      # `activity.update/end` 报 "sending 'activity' risks causing data races"。
      #
      # 但又不能只按版本号挑：runner 镜像里 Xcode_26.1.app **未随附 iOS 平台**
      # （实测：error: iOS 26.1 is not installed ... download the platform from Xcode > Settings > Components）。
      # 所以这里挑「Swift 6.2 且确实带 iOS SDK」的最高版本；若一个都没有，再给 26.1 补装 iOS 平台。
      - name: Select Xcode (match local Swift 6.2 + iOS SDK)
        run: |
          set -euo pipefail
          echo "=== 已安装 Xcode / Swift / iOS SDK ==="
          for app in /Applications/Xcode*.app; do
            sdk_dir="$app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs"
            sdk=$(ls "$sdk_dir" 2>/dev/null | head -1)
            sv=$("$app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift" --version 2>/dev/null \
                 | head -1 | sed -n 's/.*version \([0-9.]*\).*/\1/p')
            echo "$(basename "$app") | swift ${sv:-?} | iOS SDK: ${sdk:-<无>}"
          done

          TARGET=""
          while IFS= read -r app; do
            [ -d "$app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs" ] || continue
            sv=$("$app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift" --version 2>/dev/null | head -1)
            case "$sv" in
              *"version 6.2"*) TARGET="$app" ;;
            esac
          done < <(ls -d /Applications/Xcode*.app | sort -V)

          if [ -z "$TARGET" ]; then
            TARGET="/Applications/Xcode_26.1.app"
            [ -d "$TARGET" ] || TARGET=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "::warning::没有『Swift 6.2 + iOS SDK』的 Xcode，退到 $TARGET 并尝试补装 iOS 平台"
            sudo xcode-select -s "$TARGET"
            sudo xcodebuild -downloadPlatform iOS 2>&1 | tail -10 || true
          fi

          echo "Using $TARGET"
          sudo xcode-select -s "$TARGET"
          xcodebuild -version
          swift --version
          echo "=== iphoneos SDK ==="
          xcodebuild -showsdks | grep -i iphoneos || true

      # ── 跑构建前先过一遍代码检查 ──────────────────────────────
      # 目的：把"秒级能发现的问题"挡在编译之前。整包编译要十几分钟，
      # 若合并进来的分支带了语法残缺，等 build 步骤才报等于白等一轮。
      #
      # swiftc -parse 只做语法解析、**不做类型检查**，因此不需要 xcframework，
      # 也不需要 SPM 包 —— 可以放在拉框架之前。类型/链接问题仍由下面的 build 步骤兜底。
      - name: Pre-build code check
        run: |
          set -euo pipefail
          COUNT=$(find LumenAI LumenAIWidget -name '*.swift' | wc -l | tr -d ' ')
          echo "=== Swift 语法解析：$COUNT 个文件 ==="
          find LumenAI LumenAIWidget -name '*.swift' -print0 \
            | xargs -0 xcrun swiftc -parse
          echo "✅ Swift 语法全部通过"

          # Benchmark 成功判定契约的单元测试。纯函数、只依赖 Foundation，
          # 单独 swiftc 编译即可跑，不需要模拟器 —— 所以没有 test target 也能每次都跑。
          # 判定规则是 A/B 对比可信度的地基：把 required 从「全都要」改回「命中其一」
          # 这种悄悄放松的改动，必须在这里被挡下来。
          echo "=== Benchmark 判定测试 ==="
          swiftc -o /tmp/benchmark_verdict_tests \
            LumenAI/Services/AgentPerf/BenchmarkVerdict.swift \
            Tests/benchmark_verdict/main.swift
          /tmp/benchmark_verdict_tests
          echo "✅ Benchmark 判定测试全部通过"

          # Agent 气泡分段（think / 工具 chip / 正文 按真实输出顺序穿插）的单元测试。
          # ChatMessage 纯 Foundation + 条件编译的 UIKit 片段，macOS 上能单独 swiftc 编译。
          # 这是"思考与工具交替显示"的地基：切分规则必须与运行时语义一致
          # （工具 JSON 在 think 块之外才会被执行），chip 对齐用「名字 + 顺序」而不是序号 ——
          # 这两类回归都不会让构建失败，只会让界面上的思考/工具顺序错乱，必须靠测试挡。
          echo "=== agentParts 分段测试 ==="
          swiftc -o /tmp/agent_parts_tests \
            LumenAI/Data/ChatMessage.swift \
            Tests/agent_parts/main.swift
          /tmp/agent_parts_tests
          echo "✅ agentParts 分段测试全部通过"

          # Agent 主循环终止行为（P0）：断言"模型请求次数 / 终止原因 / 返回正文 / 是否清档"。
          # 这是"答案已经显示、agent 还在继续循环/继续请求模型"那类 bug 的唯一自动化防线 ——
          # 界面上看不出问题，多出来的请求发生在后台。纯逻辑，不依赖网络与模拟器。
          echo "=== agent_loop 终止行为测试 ==="
          swiftc -o /tmp/agent_loop_tests \
            LumenAI/Services/AgentPerf/AgentLoopPolicy.swift \
            Tests/agent_loop/main.swift
          /tmp/agent_loop_tests
          echo "✅ agent_loop 终止行为测试全部通过"

          # 断点存档的清档规则（P0 根因）：只有"任务真的结束"才清档。
          # 漏清一次，下一次前台化/冷启动就会把一个完成的任务重跑一遍。
          echo "=== agent_checkpoint 清档规则测试 ==="
          swiftc -o /tmp/agent_checkpoint_tests \
            LumenAI/Data/ChatMessage.swift \
            LumenAI/Services/AgentCheckpoint.swift \
            LumenAI/Services/AgentPerf/AgentLoopPolicy.swift \
            Tests/agent_checkpoint/main.swift
          /tmp/agent_checkpoint_tests
          echo "✅ agent_checkpoint 清档规则测试全部通过"

          # project.yml 的 YAML 合法性：有 pyyaml 就提前校验（xcodegen 那步也会再校验一次），
          # 没有就跳过 —— 它缺席不该让整个构建挂掉。
          echo "=== project.yml YAML 校验 ==="
          python3 -c "import yaml; yaml.safe_load(open('project.yml')); print('✅ project.yml YAML 合法')" \
            || echo "::notice::跳过 project.yml YAML 校验（本机无 pyyaml）"

      # 拉取并解压框架包到仓库根目录（project.yml 按 $(SRCROOT)/*.xcframework 引用）。
      # 必须在 xcodegen generate **之前**：XcodeGen 会校验 framework 路径是否存在。
      - name: Fetch iOS frameworks
        env:
          GH_TOKEN: ${{ github.token }}
          # `inputs` 只在 workflow_dispatch 时有值；push 事件下为空，
          # 直接引用会得到空字符串（已实测：FW_TAG/FW_ASSET 为空 → 下载失败）。
          # `||` 兜住默认值，两种触发方式都能取到正确值。
          FW_TAG: ${{ inputs.frameworks_tag || 'ios-frameworks' }}
          FW_ASSET: ${{ inputs.frameworks_asset || 'ios-frameworks.tar.gz' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/fw
          if ! gh release download "$FW_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$FW_ASSET" \
                --dir /tmp/fw --clobber; then
            echo "::error::拉取框架包失败：tag=$FW_TAG asset=$FW_ASSET。"
            echo "::error::请先按工作流头部注释，把 llama/ssh/SherpaOnnxC 打成 $FW_ASSET 传到该 Release。"
            exit 1
          fi
          tar -xzf "/tmp/fw/$FW_ASSET" -C "$GITHUB_WORKSPACE"

          # 容错：若资产里包了一层目录导致没落在根上，就地找出来搬平。
          for fw in llama.xcframework ssh.xcframework SherpaOnnxC.xcframework; do
            if [ ! -d "$GITHUB_WORKSPACE/$fw" ]; then
              hit=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -name "$fw" | head -1 || true)
              if [ -n "$hit" ]; then
                echo "搬运 $hit -> $GITHUB_WORKSPACE/$fw"
                mv "$hit" "$GITHUB_WORKSPACE/$fw"
              fi
            fi
          done

          missing=0
          for fw in llama.xcframework ssh.xcframework SherpaOnnxC.xcframework; do
            if [ -d "$GITHUB_WORKSPACE/$fw" ]; then
              echo "✅ $fw  $(du -sh "$GITHUB_WORKSPACE/$fw" | cut -f1)"
            else
              echo "::error::框架包解压后仍缺少 $fw"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      # 由 project.yml 生成 .xcodeproj（内含 SPM 依赖声明）。
      # 注意：工程名是 LumenAI（不是历史遗留的 LocalAI）。
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          ls -d LumenAI.xcodeproj

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LumenAI.xcodeproj

      # iSH（Linux 模式）静态库的构建工具链。
      #
      # 为什么单独一步、而不是让 scheme 的 preAction 顺手做：preAction 是在 xcodebuild
      # 内部跑的，工具缺失时的报错会被埋在整包构建的日志里（表现为"链接失败"或
      # "某个 .a 找不到"），而真正的原因是 meson/zig 不存在。单独一步能让失败点一眼可见。
      #
      # zig 用 pip 装（`ziglang` 包自带二进制）：这台 runner 上没装 Homebrew LLVM，
      # 而 iSH 的 vdso 需要一个能交叉编译 x86-linux 的编译器 —— zig 内置 clang+lld，
      # 正好绕开 "Homebrew 是 Tier3、装不了 llvm" 这个坑。
      - name: Install iSH build tools (meson/ninja/zig)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ish-tools"
          "$RUNNER_TEMP/ish-tools/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/ish-tools/bin/pip" install --quiet meson ninja ziglang
          echo "$RUNNER_TEMP/ish-tools/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH 只对**之后的步骤**生效，本步自己还得手动进 PATH：
          # 不加这一行，下面的 meson/ninja 会 command not found（CI run 38408907594 即如此挂掉）。
          export PATH="$RUNNER_TEMP/ish-tools/bin:$PATH"
          # patch-ish-vdso.sh 自己会按 ISH_ZIG → PATH → pip 包 的顺序找 zig，
          # 这里显式给一个，省掉"在 runner 上猜路径"的不确定性。
          ZIG="$("$RUNNER_TEMP/ish-tools/bin/python" -c 'import os,ziglang;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')"
          echo "ISH_ZIG=$ZIG" >> "$GITHUB_ENV"
          echo "zig = $ZIG"
          "$ZIG" version
          meson --version; ninja --version

      # 把 iSH「Linux 模式」引擎编出来（主工程的 LDFLAGS 引用的就是它）。
      # ISH_BUILD_LINUX=1 会：按需 clone Linux 内核源码（359MB）→ 编 liblinux/libiSHLinux
      # → 再合成主工程真正 -force_load 的那个 liblumen-linux.a（成员顺序 = initcall 顺序，
      # 见该脚本里的长注释）。ISH_SKIP_NOTLINUX=1 跳过已经用不到的 NotLinux 那套。
      # 脚本幂等：已存在就跳过，所以本地重复构建没有额外代价。
      - name: Build iSH static libs
        run: |
          set -euo pipefail
          ISH_ZIG="$ISH_ZIG" SRCROOT="$GITHUB_WORKSPACE" \
            ISH_BUILD_LINUX=1 ISH_SKIP_NOTLINUX=1 \
            /bin/bash scripts/build-ish-libs.sh
          for lib in \
            third_party/ish/build/ReleaseLinux-iphoneos/liblumen-linux.a \
            third_party/ish/build/ReleaseLinux-iphoneos/libiSHLinux.a \
            third_party/ish/build/ReleaseLinux-iphoneos/libiSHLinuxUser.a \
            third_party/ish/build/ReleaseLinux-iphoneos/meson/libish_emu.a \
            third_party/ish/build/ReleaseLinux-iphoneos/meson/libfakefs.a \
            third_party/ish/deps/build/Release-iphoneos/libarchive.a; do
            [ -f "$lib" ] || { echo "::error::缺少 $lib"; exit 1; }
            echo "✅ $lib  $(lipo -info "$lib" 2>/dev/null | tail -1)"
          done

      # 无证书编译真机包（未签名 .app）。
      # speech-swift 的 4-bit 放行补丁由 scheme 的 preAction 自动执行（见 project.yml），
      # 这里不需要单独跑。
      #
      # 单一变体（Tap / SIMULATE_TAP 已整体移除）。
      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild -scheme LumenAI -configuration Release \
            -project LumenAI.xcodeproj \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -skipMacroValidation \
            -skipPackagePluginValidation

      # 三条断言，都指向"实际会 panic / 实际会白跑"的失败模式，而不是"看起来接上了"：
      #   1) 内核符号在不在 —— 惰性链接下"库写在 LDFLAGS 里" != "代码在包里"（实测过死链接）；
      #   2) initcall 顺序 —— 内核的 init_devpts_fs(level 6) 必须排在内核侧的 ios_pty_init(level 6)
      #      前面，否则 do_mount("devpts") 返回 -ENODEV，而 LinuxPTY.c 那行是 panic()。
      #      链接顺序由 liblumen-linux.a 的成员顺序保证，这条断言就是防它被改回去；
      #   3) __percpu_first 的页对齐 —— 不对齐的话内核第一条断言就 panic("BUG!")。
      - name: Assert Linux kernel is linked and ordered
        run: |
          set -euo pipefail
          BIN="build/Build/Products/Release-iphoneos/LumenAI.app/LumenAI"
          # 后四个来自我们自己的内核侧补丁（lumen_kernel_addon.c，随 liblumen-linux.a 合成进来）：
          # 它们是「开发者面板取数（内存/网卡）」和「关闭 Linux」「注入 /etc/resolv.conf」的唯一实现，
          # 合成库的成员一改就可能整块掉出去 —— 而那样 App 只是链接失败或静默行为错，看不出来。
          for s in _run_kernel _actuate_kernel _linux_start_session _init_devpts_fs \
                   _fakefs_import _asbestos_new _lumen_linux_kernel_entry _ConsoleLog \
                   _lumen_meminfo _lumen_net_info _lumen_write_guest_file \
                   _lumen_kill_user_processes; do
            if ! nm -j "$BIN" | grep -qx "$s"; then
              echo "::error::$s 不在最终二进制里 —— Linux 内核退回惰性链接（死链接）"
              exit 1
            fi
            echo "✅ $s"
          done

          # 两套内核不能共存：NotLinux 的 become_first_process 不该再出现。
          if nm -j "$BIN" | grep -qx _become_first_process; then
            echo "::error::NotLinux 与 Linux 模式两套内核同时在包里 —— 链接没切干净"
            exit 1
          fi
          echo "✅ NotLinux 引擎已移除"

          devpts=$(nm -n "$BIN" | awk '/_init_devpts_fs6$/ {print $1; exit}')
          pty=$(nm -n "$BIN" | awk '/_ios_pty_init6$/ {print $1; exit}')
          [ -n "$devpts" ] && [ -n "$pty" ] || { echo "::error::找不到 devpts/ios_pty 的 initcall 符号"; exit 1; }
          if [ "$((16#$devpts))" -ge "$((16#$pty))" ]; then
            echo "::error::initcall 顺序反了（devpts=$devpts >= ios_pty=$pty）—— 内核会 panic 在挂 devpts 上"
            exit 1
          fi
          echo "✅ initcall 顺序：devpts($devpts) 先于 ios_pty($pty)"

          align=$(otool -l "$BIN" | awk '/sectname __percpu_first/ {f=1} f && /align/ {print $2; exit}')
          if [ "$align" != "2^12" ]; then
            echo "::error::__percpu_first 没页对齐（align=$align）—— 内核第一条断言就会 panic"
            exit 1
          fi
          echo "✅ __percpu_first 页对齐（$align）"

      # 检测是否配置了签名 Secrets
      - name: Check signing availability
        id: signcheck
        env:
          HAS_P12: ${{ secrets.P12_BASE64 != '' }}
          HAS_PASS: ${{ secrets.P12_PASSWORD != '' }}
          HAS_PROF: ${{ secrets.MOBILEPROVISION_BASE64 != '' }}
          HAS_IDENT: ${{ secrets.SIGN_IDENTITY != '' }}
        run: |
          if [ "$HAS_P12" = "true" ] && [ "$HAS_PASS" = "true" ] \
             && [ "$HAS_PROF" = "true" ] && [ "$HAS_IDENT" = "true" ]; then
            echo "signed=true"  >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 可选：自动签名 ----------
      - name: Import certificate
        if: steps.signcheck.outputs.signed == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.P12_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Sign app
        if: steps.signcheck.outputs.signed == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          PROFILE_B64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          echo "$PROFILE_B64" | base64 --decode > /tmp/app.mobileprovision
          APP="build/Build/Products/Release-iphoneos/LumenAI.app"
          cp /tmp/app.mobileprovision "$APP/embedded.mobileprovision"
          codesign --force --options runtime \
            --sign "$SIGN_IDENTITY" \
            --timestamp \
            "$APP"
          codesign --verify --strict "$APP" && echo "✅ 签名校验通过"

      - name: Package signed IPA
        if: steps.signcheck.outputs.signed == 'true'
        run: |
          rm -rf Payload && mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/LumenAI.app" Payload/
          zip -qry "LumenAI-signed.ipa" Payload
          rm -rf Payload

      # ---------- 未签名产物（供 Sideloadly / AltStore 签名）----------
      - name: Package unsigned IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/LumenAI.app" Payload/
          zip -qry "LumenAI-unsigned.ipa" Payload
          rm -rf Payload
          ls -la *.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LumenAI
          path: |
            LumenAI-unsigned.ipa
            LumenAI-signed.ipa
          if-no-files-found: ignore
          retention-days: 14
